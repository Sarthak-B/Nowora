name: Client sites & previews

# Every 10 minutes:
#  1. finds your GitHub repos that have a nowora.json file and adds any new ones to make4yu
#     (showcase card + client dashboard, link and PIN emailed to you)
#  2. captures a scrolling preview for every showcase link that needs one
# Takes a few seconds when there's nothing new. Add a DISCOVER_TOKEN secret to include private repos.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: portfolio, cancel-in-progress: false }

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Find new client sites
        run: node scripts/discover.mjs
        continue-on-error: true
        env:
          STUDIO_ENDPOINT: ${{ secrets.STUDIO_ENDPOINT }}
          STUDIO_AUTOMATION_KEY: ${{ secrets.STUDIO_AUTOMATION_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCOVER_TOKEN: ${{ secrets.DISCOVER_TOKEN }}
      - name: Any new links?
        id: check
        run: node scripts/portfolio.mjs --check
        env:
          STUDIO_ENDPOINT: ${{ secrets.STUDIO_ENDPOINT }}
          STUDIO_AUTOMATION_KEY: ${{ secrets.STUDIO_AUTOMATION_KEY }}
      - if: steps.check.outputs.pending != '0' && steps.check.outputs.pending != ''
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - if: steps.check.outputs.pending != '0' && steps.check.outputs.pending != ''
        run: npm ci
      - if: steps.check.outputs.pending != '0' && steps.check.outputs.pending != ''
        name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.check.outputs.pending != '0' && steps.check.outputs.pending != ''
        run: npx playwright install --with-deps chromium
      - if: steps.check.outputs.pending != '0' && steps.check.outputs.pending != ''
        name: Capture previews
        run: node scripts/portfolio.mjs
        env:
          STUDIO_ENDPOINT: ${{ secrets.STUDIO_ENDPOINT }}
          STUDIO_AUTOMATION_KEY: ${{ secrets.STUDIO_AUTOMATION_KEY }}
