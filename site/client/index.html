<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Client portal · NOWORA</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F2C24">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EC; --paper-2:#E2E8E1; --card:#FAFBF8; --white:#fff;
  --ink:#14211D; --ink-2:#4B5B55; --ink-3:#7D8B85;
  --pine:#1D4A3D; --pine-deep:#0F2C24; --pine-soft:#2E6553;
  --marigold:#F2A33A; --marigold-soft:#FBE3BC; --sky:#9CC6DA; --rose:#E0786A; --ok:#2F8F63; --bad:#B5483A;
  --line:rgba(20,33,29,.1); --line-2:rgba(20,33,29,.18);
  --display:"Bricolage Grotesque", Georgia, serif; --body:"Instrument Sans", system-ui, sans-serif;
  --ease:cubic-bezier(.22,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg{display:block}
.wrap{width:min(1180px,100% - 40px);margin:0 auto}
.mark{width:32px;height:32px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;background:var(--pine);color:#fff;transition:transform .3s var(--ease),background .25s,box-shadow .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -14px rgba(15,44,36,.7)}
.btn:disabled{opacity:.6;transform:none;cursor:default}
.btn.gold{background:var(--marigold);color:#2B1A04}
.btn.ghost{background:transparent;border:1.5px solid var(--line-2);color:var(--ink)}
.btn.ghost.on-dark{border-color:rgba(255,255,255,.3);color:#fff}
.btn.sm{height:38px;padding:0 15px;font-size:14px}
.btn svg{width:17px;height:17px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,rgba(242,163,58,.18),transparent 40%),radial-gradient(circle at 10% 90%,rgba(156,198,218,.14),transparent 45%),var(--pine-deep)}
.login-card{width:min(420px,100%);background:var(--card);border-radius:26px;padding:36px 32px;box-shadow:0 40px 90px -40px rgba(0,0,0,.6);animation:rise .8s var(--ease) both}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand small{font-family:var(--body);font-weight:600;font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-left:4px}
.login-card h1{font-family:var(--display);font-size:34px;line-height:1.05;letter-spacing:-.03em;margin:26px 0 8px}
.login-card p{color:var(--ink-2);font-size:15px}
.pin{display:flex;gap:8px;margin:26px 0 14px}
.pin input{flex:1;min-width:0;width:100%;height:58px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;text-align:center;font-family:var(--display);font-size:26px;font-weight:700;transition:border-color .2s,box-shadow .2s}
.pin input:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 4px rgba(29,74,61,.12)}
.pin.shake{animation:shake .45s}
.remember{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);margin-bottom:18px}
.remember input{width:18px;height:18px;accent-color:var(--pine)}
.login-card .btn{width:100%}
.msg{font-size:14px;margin-top:14px;color:var(--bad);min-height:21px}
.fine{font-size:13px;color:var(--ink-3);margin-top:18px;text-align:center}
.fine a{text-decoration:underline}

/* ---------- app ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(15,44,36,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff}
.top .wrap{display:flex;align-items:center;gap:14px;height:66px}
.top .brand{color:#fff}.top .brand small{color:#9DB7AC}
.top .sp{flex:1}
.top .who{font-size:14px;color:#C9D8D0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.top .out{font-size:14px;color:#C9D8D0;padding:8px 4px}
.top .out:hover{color:#fff}

.hero{background:var(--pine-deep);color:#fff;padding:46px 0 120px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-140px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(242,163,58,.22),transparent 65%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--marigold)}
.hero h1{font-family:var(--display);font-size:clamp(38px,5.4vw,64px);line-height:1;letter-spacing:-.035em;margin-top:12px}
.hero h1 em{font-style:normal;color:var(--marigold)}
.hero .site{display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:#C9D8D0;font-size:15px;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:2px;word-break:break-all}
.hero .site:hover{color:#fff}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:600;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#7D8B85;flex:none}
.dot.up{background:#3DD68C;box-shadow:0 0 0 0 rgba(61,214,140,.6);animation:ping 2s infinite}
.dot.down{background:var(--rose);box-shadow:0 0 0 0 rgba(224,120,106,.6);animation:ping 1.2s infinite}

.main{margin-top:-84px;position:relative;z-index:2;padding-bottom:70px}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 24px 50px -40px rgba(15,44,36,.45);min-width:0}
.card h2{font-family:var(--display);font-size:21px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.card h2 .sp{flex:1}.card h2 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.card .sub{font-size:14px;color:var(--ink-2);margin-top:4px}
.kpi .lbl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);font-weight:600}
.kpi .lbl i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--paper-2);color:var(--pine)}
.kpi .lbl i svg{width:16px;height:16px}
.kpi .val{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:18px}
.delta{display:inline-flex;margin-top:10px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-2)}
.delta.up{background:#D7EEDF;color:#1E6B45}.delta.down{background:#F6DDD8;color:#8F3427}
.kpi.lead{background:var(--pine);color:#fff;border-color:transparent}
.kpi.lead .lbl{color:#C9D8D0}.kpi.lead .lbl i{background:rgba(255,255,255,.12);color:var(--marigold)}
.kpi.lead .delta{background:rgba(255,255,255,.12);color:#F2C27A}

.two{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);margin-top:18px}
.three{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px}
.chart{position:relative;margin-top:22px;height:240px}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .bar{fill:var(--pine);transform-origin:bottom;transform-box:fill-box;transition:fill .2s}
.chart .bar.hl{fill:var(--marigold)}
.chart .tl{fill:none;stroke:var(--marigold);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .ax{font-size:11px;fill:var(--ink-3)}
.chart .gl{stroke:var(--line);stroke-dasharray:3 4}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;background:var(--pine)}.legend i.t{background:var(--marigold);height:3px;border-radius:2px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:8px 11px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s;z-index:3}
.tip b{display:block;font-size:13px}

.rows{margin-top:16px;display:grid;gap:12px}
.rowbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.rowbar b{font-weight:600;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowbar span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.rowbar .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.rowbar .track i{display:block;height:100%;border-radius:99px;background:var(--pine);width:0;transition:width 1.1s var(--ease)}
.rowbar:nth-child(2) .track i{background:var(--pine-soft)}.rowbar:nth-child(3) .track i{background:var(--marigold)}.rowbar:nth-child(n+4) .track i{background:var(--sky)}
.feed{margin-top:14px;display:grid}
.feed li{list-style:none;display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--paper-2);color:var(--pine)}
.feed .ic svg{width:16px;height:16px}
.feed .ic.wa{background:#DDF5E6;color:#178A4C}.feed .ic.lead{background:var(--marigold-soft);color:#8A560C}
.feed .tx{flex:1;min-width:0}.feed .tx small{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed time{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.empty{padding:26px 18px;text-align:center;color:var(--ink-2);font-size:14.5px;background:var(--paper);border-radius:16px;margin-top:16px}
.empty b{display:block;font-family:var(--display);font-size:18px;color:var(--ink);margin-bottom:4px}

.sec-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:54px 0 18px;flex-wrap:wrap}
.sec-title h3{font-family:var(--display);font-size:clamp(28px,3.4vw,38px);letter-spacing:-.03em;line-height:1.05}
.sec-title h3 em{font-style:normal;color:var(--pine-soft)}
.sec-title p{color:var(--ink-2);font-size:15px;max-width:420px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.steps div{position:relative;padding-top:16px;font-size:13.5px;font-weight:600;color:var(--ink-3)}
.steps div::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;border-radius:99px;background:var(--paper-2)}
.steps div.done{color:var(--ink)}.steps div.done::before{background:var(--pine)}
.steps div.now{color:var(--ink)}.steps div.now::before{background:linear-gradient(90deg,var(--marigold) 50%,var(--paper-2) 50%);background-size:200% 100%;animation:fill 2.4s var(--ease) infinite alternate}
.ring{display:flex;align-items:center;gap:18px;margin-top:20px}
.ring svg{width:92px;height:92px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--paper-2)}.ring .fg{stroke:var(--pine);stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease)}
.ring b{font-family:var(--display);font-size:30px;letter-spacing:-.02em;display:block;line-height:1}
.ring span{font-size:14px;color:var(--ink-2)}
.checks{margin-top:18px;display:grid;gap:9px}
.checks li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2)}
.checks li i{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--line-2);margin-top:1px}
.checks li.ok{color:var(--ink)}.checks li.ok i{background:var(--pine);border-color:var(--pine);color:#fff}
.checks li i svg{width:12px;height:12px}
.pay{display:grid;gap:12px;margin-top:18px}
.pay-row{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--paper);border:1px solid var(--line)}
.pay-row .amt{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.pay-row .what{flex:1;min-width:0;font-size:14px;color:var(--ink-2)}.pay-row .what b{display:block;color:var(--ink);font-size:15px}
.tag{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.tag.paid{background:#D7EEDF;color:#1E6B45}.tag.due{background:var(--marigold-soft);color:#7A4A0C}.tag.na{background:var(--paper-2);color:var(--ink-3)}
.care{margin-top:18px;padding:20px;border-radius:18px;background:var(--pine);color:#fff}
.care .amt{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.02em}
.care .amt small{font-size:15px;font-weight:500;color:#C9D8D0}
.care ul{margin-top:12px;display:grid;gap:6px;font-size:14px;color:#DCE7E1}
.care li{list-style:none;padding-left:20px;position:relative}.care li::before{content:"✓";position:absolute;left:0;color:var(--marigold);font-weight:700}
.care p{margin-top:12px;font-size:14px;color:#C9D8D0}

.req-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.types{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.types button{height:38px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line-2);font-size:14px;font-weight:600;color:var(--ink-2);transition:all .2s}
.types button.on{background:var(--ink);border-color:var(--ink);color:#fff}
textarea{width:100%;min-height:130px;margin-top:14px;border-radius:16px;border:1.5px solid var(--line-2);background:#fff;padding:14px 16px;font-size:15px;resize:vertical;transition:border-color .2s,box-shadow .2s}
textarea:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 4px rgba(29,74,61,.1)}
.req-form .btn{margin-top:14px}
.req-list{display:grid;gap:12px;margin-top:16px}
.req{padding:16px 18px;border-radius:16px;background:var(--paper);border:1px solid var(--line);animation:rise .6s var(--ease) both}
.req header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.req header b{color:var(--ink);font-size:14px}
.req header .tag{margin-left:auto}
.tag.new{background:#E1EEF5;color:#24607E}.tag.progress{background:var(--marigold-soft);color:#7A4A0C}.tag.done{background:#D7EEDF;color:#1E6B45}
.req p{margin-top:8px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.reply{margin-top:12px;padding:12px 14px;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid var(--line);font-size:14px}
.reply small{display:block;font-weight:700;font-size:12px;color:var(--pine);margin-bottom:3px}

.help{margin-top:54px;border-radius:26px;background:var(--marigold);color:#2B1A04;padding:34px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.help h3{font-family:var(--display);font-size:clamp(26px,3vw,34px);letter-spacing:-.03em;line-height:1.05}
.help p{margin-top:6px;font-size:15px}
.help .btn{background:var(--pine-deep)}
.foot{padding:30px 0 40px;font-size:13px;color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .35s var(--ease);z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{background:var(--marigold-soft);color:#5E3A08;font-size:13.5px;text-align:center;padding:9px 16px}

.in{opacity:0;transform:translateY(22px)}
.in.vis{opacity:1;transform:none;transition:opacity .8s var(--ease),transform .8s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
@keyframes fill{from{background-position:100% 0}to{background-position:0 0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart .bar{animation:grow .9s var(--ease) both}

@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.three,.req-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){
  .wrap{width:calc(100% - 32px)}
  .top .wrap{height:58px}.top .brand small,.top .who{display:none}
  .hero{padding:34px 0 104px}
  .chips{width:100%}.chip{height:36px;font-size:13px;padding:0 13px}
  .kpis{gap:12px}.card{padding:18px;border-radius:18px}
  .kpi .val{font-size:34px;margin-top:14px}.kpi .lbl{font-size:13px}.kpi .lbl i{display:none}
  .chart{height:200px}
  .help{padding:26px 22px}.help .btn{width:100%}
  .pay-row{flex-wrap:wrap}.pay-row .amt{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.in{opacity:1;transform:none}}
.quiet *{animation:none!important;transition:none!important}
</style>
</head>

  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>',

    var x=(pad.l+i*cw+cw/2)/W*el.clientWidth; tip.style.left=Math.min(Math.max(x,70),el.clientWidth-70)+"px"; tip.style.top=(y(d.v)/H*el.clientHeight)+"px"; tip.style.opacity=1; };

function animate(pct){
  var still=reduced||S.quiet;
  var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("vis"); io.unobserve(en.target); fire(en.target); } })},{threshold:.12}):null;
  $$(".in").forEach(function(el,i){ if(still||!io){ el.classList.add("vis"); fire(el); } else { el.style.transitionDelay=Math.min(i,4)*70+"ms"; io.observe(el); } });
  function fire(el){
    $$("[data-count]",el).forEach(function(n){ var to=+n.dataset.count, t0=performance.now(); if(still){n.textContent=to.toLocaleString("en-IN");return;}
      (function tick(t){ var k=Math.min(1,(t-t0)/1300); n.textContent=Math.round(to*(1-Math.pow(1-k,3))).toLocaleString("en-IN"); if(k<1) requestAnimationFrame(tick); })(t0); });
    $$("[data-w]",el).forEach(function(b){ if(still) b.style.width=b.dataset.w+"%"; else setTimeout(function(){ b.style.width=b.dataset.w+"%"; },120); });
    var r=$("#ring",el); if(r&&still) r.style.strokeDashoffset=(263.9*(1-pct/100)).toFixed(1); else if(r) setTimeout(function(){ r.style.strokeDashoffset=(263.9*(1-pct/100)).toFixed(1); },200);
  }
}
