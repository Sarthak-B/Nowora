<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Client dashboard · make4yu</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#070B0A">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B0A; --bg-2:#0B1210; --panel:#0E1613; --panel-2:#121C18; --line:rgba(234,242,238,.08); --line-2:rgba(234,242,238,.14);
  --ink:#EAF2EE; --ink-2:#A3B3AC; --ink-3:#6B7C75;
  --neon:#C6FF3D; --neon-rgb:198,255,61; --mint:#3DFFC5; --mint-rgb:61,255,197; --amber:#FFB547; --rose:#FF5C7A; --sky:#5CC8FF;
  --display:"Bricolage Grotesque", Georgia, serif; --body:"Instrument Sans", system-ui, sans-serif;
  --ease:cubic-bezier(.22,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg{display:block}
::selection{background:var(--neon);color:#0A0F0D}
.wrap{width:min(1240px,100% - 40px);margin:0 auto}
.mark{width:30px;height:30px;flex:none}
.b4{color:var(--neon);font-weight:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- ambient background ---------- */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.22;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:620px;height:620px;left:-160px;top:-220px;background:var(--neon)}
.aurora i:nth-child(2){width:520px;height:520px;right:-180px;top:22vh;background:var(--mint);opacity:.13;animation-duration:32s}
.aurora i:nth-child(3){width:480px;height:480px;left:30vw;bottom:-260px;background:#2E6553;opacity:.35;animation-duration:38s}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);opacity:.6}
@keyframes drift{to{transform:translate(80px,60px) scale(1.15)}}
#app{position:relative;z-index:1}

/* ---------- buttons, chips ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font-weight:700;font-size:15px;background:var(--neon);color:#0A0F0D;transition:transform .35s var(--spring),box-shadow .35s var(--ease),background .25s;box-shadow:0 0 0 0 rgba(var(--neon-rgb),0)}
.btn:hover{box-shadow:0 10px 40px -8px rgba(var(--neon-rgb),.55)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line-2);font-weight:600}
.btn.ghost:hover{border-color:rgba(var(--neon-rgb),.6);box-shadow:0 0 24px -6px rgba(var(--neon-rgb),.4)}
.btn.sm{height:38px;padding:0 15px;font-size:14px}
.btn svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line-2);font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.chip b{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.up{background:var(--neon);box-shadow:0 0 12px var(--neon);animation:pulse 2s infinite}
.dot.down{background:var(--rose);box-shadow:0 0 12px var(--rose);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--neon)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px}
.login-card{width:min(430px,100%);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line-2);border-radius:28px;padding:36px 32px;box-shadow:0 40px 120px -40px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:rise .9s var(--ease) both}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand small{font-family:var(--body);font-weight:600;font-size:11px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;margin-left:2px}
.for{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--neon);background:rgba(var(--neon-rgb),.08);border:1px solid rgba(var(--neon-rgb),.25);padding:6px 12px;border-radius:999px}
.login-card h1{font-family:var(--display);font-size:38px;line-height:1;letter-spacing:-.035em;margin:16px 0 10px}
.login-card h1 em{font-style:normal;color:var(--neon);text-shadow:0 0 30px rgba(var(--neon-rgb),.45)}
.login-card p{color:var(--ink-2);font-size:15px}
.pin{display:flex;gap:8px;margin:26px 0 16px}
.pin input{flex:1;min-width:0;width:100%;height:60px;border-radius:16px;border:1px solid var(--line-2);background:rgba(0,0,0,.35);text-align:center;font-family:var(--display);font-size:26px;font-weight:700;color:var(--ink);transition:border-color .2s,box-shadow .25s,transform .25s var(--spring)}
.pin input:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 4px rgba(var(--neon-rgb),.12),0 0 30px -6px rgba(var(--neon-rgb),.6);transform:translateY(-2px)}
.pin input.filled{border-color:rgba(var(--neon-rgb),.45)}
.pin.shake{animation:shake .45s}
.pin.ok input{border-color:var(--neon);box-shadow:0 0 24px -4px rgba(var(--neon-rgb),.8)}
.remember{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);margin-bottom:18px;cursor:pointer}
.remember input{width:18px;height:18px;accent-color:var(--neon)}
.login-card .btn{width:100%}
.msg{font-size:14px;margin-top:14px;color:var(--rose);min-height:21px}
.fine{font-size:13px;color:var(--ink-3);margin-top:14px;text-align:center}
.fine a{text-decoration:underline;color:var(--ink-2)}
.loader{display:grid;gap:14px;margin-top:26px}
.sk{height:16px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(var(--neon-rgb),.12),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(7,11,10,.72);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:68px}
.tabs{position:relative;display:flex;gap:2px;margin-left:12px}
.tabs a{position:relative;z-index:1;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);transition:color .25s}
.tabs a.on{color:#0A0F0D}
.tabs .ind{position:absolute;z-index:0;top:0;bottom:0;border-radius:999px;background:var(--neon);box-shadow:0 0 22px -4px rgba(var(--neon-rgb),.7);transition:left .45s var(--spring),width .45s var(--spring),opacity .3s;opacity:0}
.top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);transition:all .25s}
.icon-btn:hover{color:var(--neon);border-color:rgba(var(--neon-rgb),.5)}
.icon-btn svg{width:18px;height:18px}
.botnav{display:none}

/* ---------- hero ---------- */
.hero{padding:48px 0 22px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:end}
.hero h1{font-family:var(--display);font-size:clamp(40px,6vw,76px);line-height:.95;letter-spacing:-.045em;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--neon);text-shadow:0 0 40px rgba(var(--neon-rgb),.35)}
.hero h1 .w{display:inline-block;opacity:0;transform:translateY(40%) rotate(4deg);animation:word .9s var(--ease) forwards}
@keyframes word{to{opacity:1;transform:none}}
.site-link{display:inline-flex;align-items:center;gap:8px;margin-top:18px;color:var(--ink-2);font-size:15px;border-bottom:1px solid var(--line-2);padding-bottom:2px;word-break:break-all;transition:color .2s,border-color .2s}
.site-link:hover{color:var(--neon);border-color:var(--neon)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.inv-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px;max-width:640px}
.today .td{display:grid;gap:2px;padding:14px 16px;border-radius:16px;border:1px solid var(--line-2);background:rgba(255,255,255,.035);transition:border-color .25s,transform .3s var(--spring)}
.today .td:hover{border-color:rgba(var(--neon-rgb),.6);transform:translateY(-2px)}
.today small{font-size:12.5px;color:var(--ink-2);font-weight:600}
.today b{font-family:var(--display);font-size:26px;letter-spacing:-.02em;line-height:1.15}
.today span{font-size:12.5px;color:var(--ink-3)}
.today .td.hot{border-color:rgba(var(--neon-rgb),.55);background:rgba(var(--neon-rgb),.08)}.today .td.hot b,.today .td.hot span{color:var(--neon)}
.today .td.warn b{color:var(--amber)}
.today .td b.txt{font-size:19px;line-height:1.2;padding:4px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livebox{display:grid;gap:4px;margin:18px 0 6px}.livebox b{font-family:var(--display);font-size:18px}.livebox span{color:var(--ink-2);font-size:14px}
.checks.autos li{color:var(--ink)}
/* store layout */
.qa{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;max-width:640px}
.qa-b{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.035);font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;text-decoration:none;transition:border-color .25s,transform .3s var(--spring),background .25s}
.qa-b svg{width:16px;height:16px;color:var(--neon)}
.qa-b:hover{border-color:rgba(var(--neon-rgb),.6);transform:translateY(-2px);background:rgba(var(--neon-rgb),.06)}
.is-store #overview .hero-grid{align-items:start}
.is-store .toolbar.in-traffic{margin:0 0 16px}
.is-store .toolbar.in-traffic #share,.is-store .toolbar.in-traffic [data-edit]{display:none}
[data-kind=store] #traffic .grid.halves{display:none}
.tabs a[hidden],.botnav a[hidden]{display:none!important}
[data-kind=store] #kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
[data-kind=store] #kpis>.kpi:nth-child(3),[data-kind=store] #mtabs [data-m="leads"]{display:none}
@media (max-width:640px){[data-kind=store] #kpis{grid-template-columns:1fr}}
details.recs{margin-top:16px;border:1px solid var(--line-2);border-radius:22px;background:rgba(255,255,255,.025);overflow:hidden}
details.recs summary{display:flex;align-items:center;gap:14px;padding:18px 22px;cursor:pointer;list-style:none}
details.recs summary::-webkit-details-marker{display:none}
details.recs summary>svg{width:20px;height:20px;color:var(--neon);flex:none}
details.recs summary span{display:grid;gap:2px}details.recs summary b{font-family:var(--display);font-size:17px}details.recs summary small{color:var(--ink-3);font-size:13px}
details.recs .chev{margin-left:auto;width:10px;height:10px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);transition:transform .3s var(--spring)}
details.recs[open] .chev{transform:rotate(225deg)}
details.recs #dbRoot{padding:0 14px 16px}
@media (max-width:600px){.qa-b{flex:1 1 calc(50% - 8px);justify-content:center}}
@media (max-width:600px){.today{grid-template-columns:1fr}}
.now{position:relative;overflow:hidden;min-width:0;border-radius:var(--r);padding:24px;background:radial-gradient(circle at 85% 0%,rgba(var(--neon-rgb),.18),transparent 55%),linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid rgba(var(--neon-rgb),.22);box-shadow:0 0 60px -30px rgba(var(--neon-rgb),.6)}
.now-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.live-badge{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--neon)}
.live-badge .pp{position:relative;width:9px;height:9px;border-radius:50%;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.live-badge .pp::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid var(--neon);animation:pp 2s var(--ease) infinite}
@keyframes pp{from{transform:scale(1);opacity:.9}to{transform:scale(2.8);opacity:0}}
.now-head small{font-size:12px;color:var(--ink-3)}
.now .big{display:flex;align-items:center;gap:14px;margin-top:14px}
.now .big b{font-family:var(--display);font-size:64px;line-height:.9;letter-spacing:-.04em;color:var(--neon);text-shadow:0 0 30px rgba(var(--neon-rgb),.4)}
.now .big span{color:var(--ink);font-size:16px;font-weight:600;line-height:1.3}
.now .big span em{display:block;font-style:normal;font-weight:400;color:var(--ink-3);font-size:13.5px}
.who{list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:14px}
.who li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2);padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.035);animation:slidein .6s var(--spring) both}
.who li svg{width:15px;height:15px;color:var(--neon);flex:none}
.who li b{color:var(--ink);font-weight:600;text-transform:capitalize}
.who li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who li time{font-size:12px;color:var(--ink-3);white-space:nowrap}
.who .quiet-note{background:none;padding:2px 0;color:var(--ink-3)}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.today div{min-width:0}
.today b{display:block;font-family:var(--display);font-size:24px;letter-spacing:-.02em;line-height:1}
.today span{display:block;font-size:12px;color:var(--ink-3);margin-top:4px}
.today .vs i{font-style:normal}@media (max-width:640px){.today .vs i{display:none}}
.today .vs{font-size:11.5px;font-weight:700;margin-top:3px;color:var(--ink-3)}.today .vs.up{color:var(--neon)}.today .vs.down{color:var(--rose)}
.hours{margin-top:14px}
.hours .bars{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;align-items:end;height:44px}
.hours .bars i{display:block;border-radius:3px 3px 1px 1px;background:rgba(255,255,255,.08);min-height:3px;transform-origin:bottom;animation:growY .8s var(--ease) both}
.hours .bars i.on{background:rgba(var(--neon-rgb),.55)}
.hours .bars i.cur{background:var(--neon);box-shadow:0 0 12px rgba(var(--neon-rgb),.8)}
.hours .bars i.fut{background:rgba(255,255,255,.03)}
.hours .ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:6px}
.hours .cap{font-size:12px;color:var(--ink-3);margin-top:2px}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(4.2);opacity:0}}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 18px}
.seg{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line-2)}
.seg button{position:relative;z-index:1;height:34px;padding:0 15px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--ink-2);transition:color .25s}
.seg button.on{color:#0A0F0D}
.seg .thumb{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:999px;background:var(--neon);box-shadow:0 0 18px -3px rgba(var(--neon-rgb),.7);transition:left .45s var(--spring),width .45s var(--spring)}
.filter-chip{display:none;align-items:center;gap:8px;height:36px;padding:0 8px 0 14px;border-radius:999px;background:rgba(var(--mint-rgb),.1);border:1px solid rgba(var(--mint-rgb),.4);color:var(--mint);font-size:13.5px;font-weight:700;animation:pop .4s var(--spring)}
.filter-chip.on{display:inline-flex}
.filter-chip button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--mint-rgb),.15);font-size:15px;line-height:1}
.toolbar .sp{flex:1}
@keyframes pop{from{transform:scale(.8);opacity:0}}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0;overflow:hidden;transition:border-color .35s,transform .45s var(--ease)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,-40%),rgba(var(--neon-rgb),.09),transparent 45%);opacity:0;transition:opacity .4s}
.card:hover{border-color:rgba(var(--neon-rgb),.22)}
.card:hover::before{opacity:1}
.card h2{font-family:var(--display);font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.card h2 small{font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .lbl{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.kpi .lbl i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(var(--neon-rgb),.08);color:var(--neon);border:1px solid rgba(var(--neon-rgb),.18)}
.kpi .lbl i svg{width:16px;height:16px}
.kpi .val{font-family:var(--display);font-size:46px;font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:18px}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px}
.kpi svg.mini{width:90px;height:30px;flex:none}
.kpi .mini path{fill:none;stroke:var(--neon);stroke-width:1.8;stroke-linecap:round}
.kpi:nth-child(2) .mini path{stroke:var(--mint)}.kpi:nth-child(3) .mini path{stroke:var(--amber)}.kpi:nth-child(4) .mini path{stroke:var(--sky)}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--ink-2);white-space:nowrap}
.delta.up{background:rgba(var(--neon-rgb),.1);color:var(--neon)}.delta.down{background:rgba(255,92,122,.12);color:var(--rose)}
.kpi.hero-kpi{border-color:rgba(var(--neon-rgb),.3);background:radial-gradient(circle at 100% 0%,rgba(var(--neon-rgb),.14),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015))}
.kpi.hero-kpi .val{color:var(--neon);text-shadow:0 0 28px rgba(var(--neon-rgb),.4)}

.two{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);margin-top:16px}
.three{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px}
.halves{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:16px}

/* chart */
.metric-tabs{display:flex;gap:6px;flex-wrap:wrap}
.metric-tabs button{height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);transition:all .25s}
.metric-tabs button.on{color:var(--neon);border-color:rgba(var(--neon-rgb),.5);background:rgba(var(--neon-rgb),.08)}
.cmp{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.cmp input{accent-color:var(--neon)}
.chart{position:relative;height:280px;margin-top:18px}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .ln{fill:none;stroke:var(--neon);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(var(--neon-rgb),.7))}
.chart .ar{fill:url(#chartGrad)}
.chart .pv{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:4 5;opacity:.8}
.chart .gl{stroke:var(--line)}
.chart .ax{font-size:11px;fill:var(--ink-3)}
.chart .cross{stroke:rgba(var(--neon-rgb),.5);stroke-dasharray:3 4;opacity:0;transition:opacity .15s}
.chart .pt{fill:var(--bg);stroke:var(--neon);stroke-width:2.5;opacity:0;transition:opacity .15s;filter:drop-shadow(0 0 6px rgba(var(--neon-rgb),.9))}
.tip{position:absolute;pointer-events:none;background:rgba(10,15,13,.92);border:1px solid rgba(var(--neon-rgb),.35);color:var(--ink);font-size:12.5px;padding:9px 12px;border-radius:12px;white-space:nowrap;transform:translate(-50%,-118%);opacity:0;transition:opacity .15s;z-index:3;box-shadow:0 10px 30px -10px rgba(0,0,0,.8)}
.tip b{display:block;font-size:13px;color:var(--neon)}

/* bars */
.rows{margin-top:16px;display:grid;gap:10px}
.rowbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;font-size:14px;padding:8px 10px;margin:0 -10px;border-radius:12px;transition:background .2s}
.rowbar.click{cursor:pointer}
.rowbar.click:hover{background:rgba(255,255,255,.04)}
.rowbar.sel{background:rgba(var(--mint-rgb),.08);box-shadow:inset 0 0 0 1px rgba(var(--mint-rgb),.35)}
.rowbar b{font-weight:600;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowbar span{color:var(--ink-3)}
.rowbar .track{grid-column:1/-1;height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.rowbar .track i{display:block;height:100%;border-radius:99px;background:var(--neon);box-shadow:0 0 12px rgba(var(--neon-rgb),.6);width:0;transition:width 1s var(--ease)}
.rowbar:nth-child(2) .track i{background:var(--mint);box-shadow:0 0 12px rgba(var(--mint-rgb),.6)}.rowbar:nth-child(3) .track i{background:var(--amber);box-shadow:none}.rowbar:nth-child(n+4) .track i{background:var(--sky);box-shadow:none}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:10px}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:20px;margin-top:16px}
.donut{width:140px;height:140px;flex:none;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:16;transition:stroke-dasharray 1.1s var(--ease),stroke-dashoffset 1.1s var(--ease)}
.legend{display:grid;gap:10px;font-size:14px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.legend span{text-transform:capitalize}

/* heatmap */
.heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:3px;margin-top:16px;font-size:10.5px;color:var(--ink-3)}
.heat .c{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.04);transition:transform .2s var(--spring),box-shadow .2s;position:relative}
.heat .c:hover{transform:scale(1.5);z-index:2;box-shadow:0 0 0 1px var(--neon)}
.heat .d{display:flex;align-items:center}
.heat .h{text-align:center}
.peak{margin-top:12px;font-size:14px;color:var(--ink-2)}.peak b{color:var(--neon)}

/* funnel */
.funnel{display:grid;gap:12px;margin-top:16px}
.fstep{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.fstep .bar{grid-column:1/-1;height:34px;border-radius:10px;background:rgba(255,255,255,.04);overflow:hidden;position:relative}
.fstep .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:10px;background:linear-gradient(90deg,rgba(var(--neon-rgb),.9),rgba(var(--mint-rgb),.7));box-shadow:0 0 20px -4px rgba(var(--neon-rgb),.8);transition:width 1.2s var(--ease)}
.fstep .bar em{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:800;font-size:14px;color:#0A0F0D;mix-blend-mode:normal}
.fstep b{font-size:14px}.fstep span{font-size:12.5px;color:var(--ink-3)}

/* feed */
.feed{margin-top:12px;display:grid;max-height:340px;overflow:auto;scrollbar-width:thin}
.feed li{list-style:none;display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed li.fresh{animation:slidein .7s var(--spring)}
@keyframes slidein{from{opacity:0;transform:translateX(-20px);background:rgba(var(--neon-rgb),.08)}}
.feed .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.05);color:var(--ink-2)}
.feed .ic svg{width:16px;height:16px}
.feed .ic.wa{background:rgba(var(--neon-rgb),.1);color:var(--neon)}.feed .ic.lead{background:rgba(255,181,71,.12);color:var(--amber)}
.feed .tx{flex:1;min-width:0}.feed .tx small{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed time{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.empty{padding:26px 18px;text-align:center;color:var(--ink-2);font-size:14.5px;background:rgba(255,255,255,.025);border:1px dashed var(--line-2);border-radius:16px;margin-top:16px}
.empty b{display:block;font-family:var(--display);font-size:18px;color:var(--ink);margin-bottom:4px}

/* section titles */
.sec{padding-top:64px}
.sec-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.sec-title h3{font-family:var(--display);font-size:clamp(30px,3.6vw,44px);letter-spacing:-.04em;line-height:1}
.sec-title h3 em{font-style:normal;color:var(--neon)}
.sec-title p{color:var(--ink-2);font-size:15px;max-width:440px}

/* website */
.site-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.device{position:relative;margin-top:16px;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line-2);height:440px;transition:all .6s var(--ease)}
.device .bar{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.device .bar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.15)}
.device .bar span{margin-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.device .vp{position:absolute;left:0;right:0;top:34px;bottom:0;overflow:hidden;background:#fff}
.device iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.device.phone{width:300px;height:600px;margin-left:auto;margin-right:auto;border-radius:38px;border:10px solid #151d1a;box-shadow:0 0 0 1px var(--line-2),0 30px 80px -30px rgba(0,0,0,.9)}
.device.phone .bar{display:none}.device.phone .vp{top:0}
.dev-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:14px;background:var(--panel);transition:opacity .5s}
.dev-load.gone{opacity:0;pointer-events:none}
.health{display:grid;gap:12px;margin-top:16px}
.hrow{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.hrow .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(var(--neon-rgb),.08);color:var(--neon);flex:none}
.hrow .ic.bad{background:rgba(255,92,122,.1);color:var(--rose)}
.hrow .ic svg{width:18px;height:18px}
.hrow div{flex:1;min-width:0;font-size:13.5px;color:var(--ink-2)}.hrow div b{display:block;font-size:15px;color:var(--ink)}
.gauge{width:100%;max-width:220px;margin:6px auto 0}
.gauge path{fill:none;stroke-width:12;stroke-linecap:round}
.gauge .bg{stroke:rgba(255,255,255,.07)}
.gauge .fg{stroke:var(--neon);filter:drop-shadow(0 0 8px rgba(var(--neon-rgb),.7));transition:stroke-dashoffset 1.4s var(--ease)}
.gauge text{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:26px;text-anchor:middle}
.gauge .s{fill:var(--ink-3);font-family:var(--body);font-size:11px;font-weight:600}
.qr-box{display:grid;place-items:center;margin-top:16px;padding:18px;border-radius:18px;background:#fff;width:200px;height:200px;margin-left:auto;margin-right:auto;box-shadow:0 0 0 1px rgba(var(--neon-rgb),.4),0 0 50px -12px rgba(var(--neon-rgb),.6)}
.qr-box img,.qr-box canvas{width:164px!important;height:164px!important;image-rendering:pixelated}
.qr-actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}

/* project */
.timeline{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px}
.timeline::before{content:"";position:absolute;left:16px;right:16px;top:15px;height:2px;background:rgba(255,255,255,.08)}
.timeline .fill{position:absolute;left:16px;top:15px;height:2px;background:var(--neon);box-shadow:0 0 12px var(--neon);width:0;transition:width 1.4s var(--ease)}
.tstep{position:relative;display:grid;justify-items:start;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink-3)}
.tstep:nth-child(3){justify-items:center;text-align:center}.tstep:nth-child(4){justify-items:end;text-align:right}
.tstep i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid rgba(255,255,255,.12);color:var(--ink-3);transition:all .5s var(--ease)}
.tstep i svg{width:14px;height:14px}
.tstep.done{color:var(--ink)}.tstep.done i{background:var(--neon);border-color:var(--neon);color:#0A0F0D;box-shadow:0 0 18px rgba(var(--neon-rgb),.6)}
.tstep.now{color:var(--ink)}.tstep.now i{border-color:var(--neon);animation:pulse 1.6s infinite}
.ringrow{display:flex;align-items:center;gap:18px;margin-top:22px}
.ring{width:96px;height:96px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.07)}.ring .fg{stroke:var(--neon);stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease);filter:drop-shadow(0 0 6px rgba(var(--neon-rgb),.7))}
.ringrow b{font-family:var(--display);font-size:32px;letter-spacing:-.02em;display:block;line-height:1}
.ringrow span{font-size:14px;color:var(--ink-2)}
.checks{margin-top:18px;display:grid;gap:9px}
.checks li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-3)}
.checks li i{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--line-2);margin-top:1px}
.checks li.ok{color:var(--ink)}.checks li.ok i{background:var(--neon);border-color:var(--neon);color:#0A0F0D}
.checks li i svg{width:11px;height:11px}
.pay{display:grid;gap:12px;margin-top:18px}
.pay-row{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.pay-row .amt{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.pay-row .what{flex:1;min-width:0;font-size:13.5px;color:var(--ink-2)}.pay-row .what b{display:block;color:var(--ink);font-size:15px}
.tag{font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.tag.paid{background:rgba(var(--neon-rgb),.12);color:var(--neon)}.tag.due{background:rgba(255,181,71,.14);color:var(--amber)}
.care{position:relative;margin-top:16px;padding:20px;border-radius:18px;background:radial-gradient(circle at 100% 0%,rgba(var(--mint-rgb),.14),transparent 60%),rgba(255,255,255,.03);border:1px solid rgba(var(--mint-rgb),.25);display:flex;gap:18px;align-items:center}
.care .amt{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em}
.care .amt small{font-size:14px;font-weight:500;color:var(--ink-2)}
.care ul{margin-top:10px;display:grid;gap:5px;font-size:13.5px;color:var(--ink-2)}
.care li{list-style:none;padding-left:18px;position:relative}.care li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.care p{margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.days{position:relative;width:96px;height:96px;flex:none;display:grid;place-items:center;text-align:center}
.days svg{position:absolute;inset:0;transform:rotate(-90deg)}
.days circle{fill:none;stroke-width:7}.days .bg{stroke:rgba(255,255,255,.07)}.days .fg{stroke:var(--mint);stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease);filter:drop-shadow(0 0 6px rgba(var(--mint-rgb),.7))}
.days b{font-family:var(--display);font-size:26px;line-height:1}.days small{display:block;font-size:11px;color:var(--ink-3)}

/* requests */
.req-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.types{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.types button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .25s var(--ease)}
.types button:hover{border-color:rgba(var(--neon-rgb),.5)}
.types button.on{background:var(--neon);border-color:var(--neon);color:#0A0F0D;box-shadow:0 0 18px -4px rgba(var(--neon-rgb),.7)}
textarea{width:100%;min-height:130px;margin-top:14px;border-radius:16px;border:1px solid var(--line-2);background:rgba(0,0,0,.3);padding:14px 16px;font-size:15px;resize:vertical;color:var(--ink);transition:border-color .2s,box-shadow .2s}
textarea::placeholder{color:var(--ink-3)}
textarea:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 4px rgba(var(--neon-rgb),.1)}
.attach{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:14px;border:1px dashed var(--line-2);cursor:pointer;color:var(--ink-2);font-size:14px;transition:border-color .2s,background .2s}
.attach:hover,.attach.over{border-color:var(--neon);background:rgba(var(--neon-rgb),.05)}
.attach input{display:none}
.attach .th{width:52px;height:52px;border-radius:10px;background:rgba(255,255,255,.05) center/cover;display:grid;place-items:center;flex:none;color:var(--ink-3)}
.attach .th svg{width:20px;height:20px}
.attach .x{margin-left:auto;width:30px;height:30px;border-radius:50%;display:none;place-items:center;background:rgba(255,255,255,.06);font-size:16px}
.attach.has .x{display:grid}
.req-form .btn{margin-top:14px;width:100%}
.req-list{display:grid;gap:12px;margin-top:16px}
.req{padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line);animation:rise .6s var(--ease) both}
.req.unread{border-color:rgba(var(--neon-rgb),.45);box-shadow:0 0 30px -14px rgba(var(--neon-rgb),.8)}
.req header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.req header b{color:var(--ink);font-size:14px}
.req header .tag{margin-left:auto}
.tag.new{background:rgba(92,200,255,.12);color:var(--sky)}.tag.progress{background:rgba(255,181,71,.14);color:var(--amber)}.tag.done{background:rgba(var(--neon-rgb),.12);color:var(--neon)}
.newbadge{font-size:11px;font-weight:800;letter-spacing:.06em;color:#0A0F0D;background:var(--neon);padding:2px 8px;border-radius:999px}
.req p{margin-top:8px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.req .ph{display:block;margin-top:10px;width:120px;height:80px;border-radius:10px;background:rgba(255,255,255,.05) center/cover;border:1px solid var(--line)}
.reply{margin-top:12px;padding:12px 14px;border-radius:14px 14px 14px 4px;background:rgba(var(--neon-rgb),.06);border:1px solid rgba(var(--neon-rgb),.2);font-size:14px}
.reply small{display:block;font-weight:800;font-size:11px;letter-spacing:.1em;color:var(--neon);margin-bottom:3px}
.progressline{height:3px;border-radius:99px;background:rgba(255,255,255,.06);margin-top:12px;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--neon);box-shadow:0 0 10px var(--neon)}

/* help + footer */
.help{position:relative;overflow:hidden;margin-top:64px;border-radius:28px;padding:38px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:radial-gradient(circle at 0% 100%,rgba(var(--neon-rgb),.25),transparent 50%),radial-gradient(circle at 100% 0%,rgba(var(--mint-rgb),.18),transparent 50%),var(--panel);border:1px solid rgba(var(--neon-rgb),.25)}
.help h3{font-family:var(--display);font-size:clamp(28px,3.4vw,40px);letter-spacing:-.035em;line-height:1}
.help p{margin-top:8px;font-size:15px;color:var(--ink-2)}
.help .acts{display:flex;gap:10px;flex-wrap:wrap}
.foot{padding:34px 0 48px;font-size:13px;color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px) scale(.96);display:flex;align-items:center;gap:10px;background:rgba(14,22,19,.95);border:1px solid rgba(var(--neon-rgb),.4);color:var(--ink);padding:12px 18px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;transition:all .45s var(--spring);z-index:80;max-width:calc(100% - 32px);box-shadow:0 20px 50px -20px rgba(0,0,0,.9),0 0 30px -10px rgba(var(--neon-rgb),.6)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 10px var(--neon);flex:none}
.upsell{position:fixed;inset:0;z-index:600;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .3s}
.upsell.on{opacity:1}
.up-card{position:relative;width:min(460px,100%);padding:30px;border-radius:26px;background:radial-gradient(circle at 100% 0%,rgba(var(--neon-rgb),.2),transparent 55%),var(--panel);border:1px solid rgba(var(--neon-rgb),.35);box-shadow:0 0 60px -20px rgba(var(--neon-rgb),.6);transform:translateY(20px) scale(.96);transition:transform .45s var(--spring)}
.upsell.on .up-card{transform:none}
.up-card h3{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:-.035em;margin:12px 0 10px}.up-card h3 em{font-style:normal;color:var(--neon)}
.up-card p{color:var(--ink-2);font-size:15px}.up-card p b{color:var(--ink)}
.up-card ul{list-style:none;display:grid;gap:8px;margin:18px 0 4px}.up-card li{position:relative;padding-left:26px;font-size:14.5px}.up-card li::before{content:"✓";position:absolute;left:0;color:var(--neon);font-weight:800}
.up-card .btn{width:100%;margin-top:20px}
.up-x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.06);font-size:20px;color:var(--ink-2)}
.ownerbar{position:relative;z-index:31;background:var(--mint);color:#04120D;font-size:13px;font-weight:700;text-align:center;padding:8px 16px}
.demo{position:relative;z-index:31;background:var(--neon);color:#0A0F0D;font-size:13px;font-weight:700;text-align:center;padding:8px 16px}
.burst{position:fixed;pointer-events:none;z-index:90;width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 10px var(--neon)}

.in{opacity:0;transform:translateY(26px);filter:blur(6px)}
.in.vis{opacity:1;transform:none;filter:none;transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}
.swap{animation:swap .5s var(--ease)}
@keyframes swap{from{opacity:.25;transform:translateY(6px)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

    d.innerHTML='<summary>'+I.db+'<span><b>All records</b><small>'+(store?'Every order and payment':'Every '+(KINDS[kind]?KINDS[kind].tab.toLowerCase().replace(/s$/,"").replace(/ie$/,"y"):"entry"))+' as a table — search, edit or download</small></span><i class="chev"></i></summary>';
    $("#"+main).appendChild(d); d.appendChild(db); $("#database").hidden=true; $$('a[href="#database"]').forEach(function(a){a.hidden=true});
    d.addEventListener("toggle",function(){if(d.open&&initDB.go)initDB.go()})}
  // quick actions under Today
  var ro=isRO(), qa=document.createElement("div"); qa.className="qa"; qa.id="qa";
  qa.innerHTML=store?(ro?'':'<button type="button" class="qa-b" data-qa="add">'+I.tag+'<span>Add a product</span></button>')+
    '<a class="qa-b" href="#shop">'+I.bag+'<span>Orders</span></a>'+
    (ro?'':'<button type="button" class="qa-b" data-edit>'+I.pen+'<span>Edit website</span></button>')+
    '<button type="button" class="qa-b" data-qa="share">'+I.share+'<span>Share my store</span></button>'
    :KINDS[kind].qa.filter(function(q){return !(ro&&(q[0]==="edit"||q[0]==="help"))}).map(function(q){return q[0]==="inbox"?'<a class="qa-b" href="#inbox">'+I[q[2]]+'<span>'+q[1]+'</span></a>':
      q[0]==="edit"?'<button type="button" class="qa-b" data-edit>'+I.pen+'<span>'+q[1]+'</span></button>':
      q[0]==="help"?'<a class="qa-b" href="#requests">'+I.chat+'<span>'+q[1]+'</span></a>':'<button type="button" class="qa-b" data-qa="share">'+I.share+'<span>'+q[1]+'</span></button>'}).join("");
  $("#today").after(qa);
  $$("[data-edit]",qa).forEach(function(b){b.onclick=openEditor});
  qa.addEventListener("click",function(e){var b=e.target.closest("[data-qa]");if(!b)return;
    if(b.dataset.qa==="share") return $("#share").click();
    if(b.dataset.qa==="add"){var go=function(){var a=$("#shAdd");if(a){a.scrollIntoView({block:"center",behavior:reduced?"auto":"smooth"});setTimeout(function(){a.click()},reduced?0:450)}else setTimeout(go,300)};if(location.hash!=="#products")history.pushState(history.state,"","#products");go()}});
  addAutos(store?AUTOS_STORE:AUTOS_FORMS);
  if(S.spy) setTimeout(S.spy,50);
  dispatchEvent(new Event("resize"));
}
function addAutos(list){var ul=$("#autoList");if(!ul)return;list.forEach(function(x){if(ul.textContent.indexOf(x.replace(/\\'/g,"'"))>=0)return;var li=document.createElement("li");li.className="ok";li.innerHTML="<i>"+I.check+"</i>"+x;ul.appendChild(li)})}

/* ---------- live polling ---------- */
function startPolling(){
  clearInterval(S.poll);
  S.poll=setInterval(async function(){
    if(document.hidden) return;
    try{var j=await call("portal",{since:S.lastSec});var n=ingest(j.data.events,true);S.data.client=j.data.client;
      if(isRO()!==S.ro){toast(isRO()?(planOff()?"Your care plan is off — your dashboard is now view-only":"Your dashboard is now view-only"):"Editing is back on");setTimeout(function(){location.reload()},1500);return}
      var oldReq=JSON.stringify(S.data.requests);S.data.requests=j.data.requests;
      S.quiet=true;drawAll(false);S.quiet=false;drawNow();
      if(n){drawFeed(n);var last=S.rows[S.rows.length-1];toast(n===1?feedLabel(last):n+" new things happened on your site")}
      if(oldReq!==JSON.stringify(S.data.requests)&&!($("#rm")&&$("#rm").value)){drawRequests();if(S.data.requests.some(function(r){return r.reply&&!S.seenReplies[r.id+":"+r.reply.length]}))toast("make4yu replied to your request")}
    }catch(x){if(/PIN|not valid/i.test(x.message)){forget();login(x.message)}}
  },30000);
}
function feedLabel(e){return ({pageview:"New visitor",cta_whatsapp:"Someone tapped WhatsApp",cta_call:"Someone tapped to call",cta_email:"Someone tapped email",lead_submit:"New enquiry"}[e.type]||"New activity")+(e.ref&&e.ref!=="direct"?" from "+e.ref:"")}

/* ---------- demo data ---------- */
function demoCall(action,extra){
  return new Promise(function(res,rej){setTimeout(function(){
    if(action==="portal"&&S.pin!=="123456")return rej(new Error("Wrong PIN — the demo PIN is 123456"));
    var now=nowSec();
    if(!demoCall.d){
      var refs=["instagram","google","direct","whatsapp","google maps","facebook"],rw=[30,26,18,12,8,6],devs=["mobile","desktop","tablet"],dw=[76,21,3],paths=["/","/menu","/book","/gallery"],pw=[50,28,14,8];
      var pick=function(a,w){var t=w.reduce(function(s,x){return s+x},0),r=Math.random()*t;for(var i=0;i<a.length;i++){if((r-=w[i])<0)return i}return 0};
      var rows=[],vid=0;
      for(var d=179;d>=0;d--){var base=Math.round(9+(179-d)*.09+Math.sin(d/5)*3+((new Date((now-d*DAY)*1000).getDay()%6===0)?5:0));
        for(var k=0;k<base;k++){var hr=[9,11,12,13,17,18,19,20,21,15][Math.floor(Math.random()*10)];var t=now-d*DAY-Math.floor(Math.random()*3600)-((new Date(now*1000).getHours()-hr+24)%24)*3600;if(t>now)t=now-Math.floor(Math.random()*3000);
          var r=pick(refs,rw),dv=pick(devs,dw),v=vid++;rows.push([t,0,r,dv,0,v]);if(Math.random()<.45)rows.push([t+40,0,r,dv,pick(paths,pw),v]);
          if(Math.random()<.13)rows.push([t+90,1,r,dv,1,v]);else if(Math.random()<.04)rows.push([t+90,2,r,dv,0,v]);if(Math.random()<.035)rows.push([t+150,3,r,dv,2,v]);}}
      for(var q=0;q<4;q++)rows.push([now-60*(q*6+1),q===1?1:0,q%2,0,0,vid++]);
      rows.sort(function(a,b){return a[0]-b[0]});
      demoCall.vid=vid;
      demoCall.d={client:{business:"Brew & Bloom Café",name:"Sana Kapoor",site:"https://brewandbloom.in",status:"live",package:"Business",price:"29999",delivered:"2026-10-20",carePlan:"yes",careFee:"999",renewal:new Date(Date.now()+19*864e5).toISOString().slice(0,10),uptime:"up",responseMs:"640",lastCheck:new Date(Date.now()-3*6e4).toISOString(),advancePaid:"yes",balancePaid:"",tracking:true,checklist:"[0,1,2,3,4,5,6]"},
        events:{types:["pageview","cta_whatsapp","cta_call","lead_submit"],refs:refs,devices:devs,paths:paths,rows:rows},
        requests:[{id:"r1",ts:new Date(Date.now()-3*864e5).toISOString(),type:"Text or photo change",message:"Please add our new Sunday brunch menu and change timings to 9 am – 4 pm.",status:"done",reply:"Done! The brunch menu is live on the Menu page and the timings are updated everywhere."},{id:"r2",ts:new Date(Date.now()-5*36e5).toISOString(),type:"New section or page",message:"Can we add a small gallery of the new terrace seating?",status:"progress",reply:"Love it — we'll use the photos you sent. Live by tomorrow evening."}]};
    }
    if(action==="site_source"){fetch("/client/demo-site.html").then(function(r){return r.text()}).then(function(html){res({ok:true,site:{repo:"demo/brew-and-bloom",path:"index.html",sha:demoCall.sha||"demo1",html:demoCall.html||html,url:location.origin+"/client/",niche:"Bakery & café",name:"Brew & Bloom Café"}})}).catch(rej);return}
    if(action==="site_publish"){demoCall.html=extra.html;demoCall.sha="demo"+Date.now();(demoCall.vers=demoCall.vers||[]).unshift({sha:demoCall.sha,date:new Date().toISOString(),message:(extra.message||"Website edited")+" (make4yu editor)"});return res({ok:true,sha:demoCall.sha})}
    if(action==="site_versions"){return res({ok:true,versions:(demoCall.vers||[]).concat([{sha:"a1b2c3d",date:new Date(Date.now()-3*864e5).toISOString(),message:"Launch: Brew & Bloom website"}])})}
    if(action==="site_restore"){demoCall.html=null;demoCall.sha="demo"+Date.now();return res({ok:true})}
    if(action==="portal_request"){demoCall.d.requests.unshift({id:"r"+Date.now(),ts:new Date().toISOString(),type:extra.request.type,message:extra.request.message,status:"new",reply:"",attachment:extra.request.photo||""});return res({ok:true})}
    var out=JSON.parse(JSON.stringify(demoCall.d));
    if(extra&&extra.since){ // simulate a new visitor now and then
      var e=demoCall.d.events, add=[];if(Math.random()<.8){add.push([now,0,Math.floor(Math.random()*3),0,0,demoCall.vid++]);if(Math.random()<.4)add.push([now,1,0,0,0,demoCall.vid-1])}
      e.rows=e.rows.concat(add);out.events=Object.assign({},e,{rows:add});}
    res({ok:true,data:out});
  },350)});
}
